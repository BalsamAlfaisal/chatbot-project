name: Build and Deploy

on:
  # Manual only: run from the Actions tab once the Docker Hub and Azure secrets are set.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chatbot
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-frontend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run update_app.sh on the VM
        run: |
          az vm run-command invoke \
            --resource-group "${{ secrets.RESOURCE_GROUP_NAME }}" \
            --name "${{ secrets.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "sudo -u azureuser bash /home/azureuser/chatbot-project/update_app.sh" \
            --query "value[].message" -o tsv
